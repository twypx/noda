name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.10)'
        required: true
        default: 'v1.0.10'

jobs:
  build-and-release:
    name: Build DEB and Publish Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            dpkg-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            libxcb1-dev

      - name: Run automated test suite
        run: |
          cd npp-linux
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: /tmp/noda_ci_config

      - name: Build DEB package
        run: |
          cd npp-linux
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Generate Checksums
        run: |
          cd npp-linux/build-deb
          sha256sum *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Noda ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            npp-linux/build-deb/*.deb
            npp-linux/build-deb/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
